<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efeee4"><meta name="color-scheme" content="light">
<title>Весёлый фермер · QuizzyWizzy</title>
<link rel="stylesheet" href="/app/shell/qw-tokens.css">
<link rel="stylesheet" href="/app/shell/qw-shell.css">
<link rel="stylesheet" href="/app/farm/assets/style.css">
<link rel="stylesheet" href="/app/farm/assets/dasha-game.css">
<link rel="stylesheet" href="/app/farm/assets/oleg-game.css">
<script src="/app/shell/qw-shell.js"></script>
<script type="module" src="/app/farm/assets/app.js"></script>
</head>
<body class="compact farm-login">
<header class="topbar">
 <button id="lighting-toggle" class="lighting-toggle" type="button" data-mode="auto" data-dark="false" aria-label="Свет: по времени. Нажми, чтобы сменить режим" title="Свет: по времени"><svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">
  <g class="lighting-sun"><g fill="#f2c763"><rect x="18.4" y="2.6" width="3.2" height="6" rx="1.6" transform="rotate(0 20 20)"/><rect x="18.4" y="2.6" width="3.2" height="6" rx="1.6" transform="rotate(45 20 20)"/><rect x="18.4" y="2.6" width="3.2" height="6" rx="1.6" transform="rotate(90 20 20)"/><rect x="18.4" y="2.6" width="3.2" height="6" rx="1.6" transform="rotate(135 20 20)"/><rect x="18.4" y="2.6" width="3.2" height="6" rx="1.6" transform="rotate(180 20 20)"/><rect x="18.4" y="2.6" width="3.2" height="6" rx="1.6" transform="rotate(225 20 20)"/><rect x="18.4" y="2.6" width="3.2" height="6" rx="1.6" transform="rotate(270 20 20)"/><rect x="18.4" y="2.6" width="3.2" height="6" rx="1.6" transform="rotate(315 20 20)"/></g><circle cx="20" cy="20" r="9.6" fill="#eeb64f"/><circle cx="20" cy="20" r="8.2" fill="#f5c862"/><ellipse cx="16.6" cy="16.4" rx="3.6" ry="2.3" fill="#fff2c4" opacity=".85" transform="rotate(-32 16.6 16.4)"/></g>
  <g class="lighting-moon"><mask id="lt-moon-cut"><rect width="40" height="40" fill="#fff"/><circle cx="26.2" cy="13.8" r="10.2" fill="#000"/></mask><g mask="url(#lt-moon-cut)"><circle cx="19" cy="20.6" r="13.4" fill="#d6bf6f"/><circle cx="19.8" cy="19.8" r="12" fill="#ecd88d"/><circle cx="12.8" cy="24.6" r="2" fill="#dcc77e"/><circle cx="17.4" cy="29.6" r="1.4" fill="#dcc77e"/></g><path d="m31 4.8 1 2.9 2.9 1-2.9 1-1 2.9-1-2.9-2.9-1 2.9-1Z" fill="#f6d77c"/><circle cx="34.6" cy="20.4" r="1.3" fill="#f6d77c"/></g>
  <g class="lighting-auto"><g fill="#f2c763"><rect x="17.4" y="1.8" width="3.2" height="5" rx="1.6" transform="rotate(-45 19 20)"/><rect x="17.4" y="1.8" width="3.2" height="5" rx="1.6" transform="rotate(-90 19 20)"/><rect x="17.4" y="1.8" width="3.2" height="5" rx="1.6" transform="rotate(-135 19 20)"/></g><path class="la-day" d="M19 9a11 11 0 0 0 0 22Z" fill="#f2c25e"/><path class="la-night" d="M19 9a11 11 0 0 1 0 22Z" fill="#7488b2"/><ellipse cx="14.4" cy="15.6" rx="2.4" ry="1.6" fill="#fff2c4" opacity=".8" transform="rotate(-35 14.4 15.6)"/><path class="la-night" d="m24 12.6.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7Z" fill="#f6e3a0"/><circle class="la-night" cx="24.4" cy="22.8" r="1" fill="#f6e3a0"/><g class="la-cycle" fill="none" stroke="#5f9a6e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M35.6 32.4A4.8 4.8 0 1 1 33.8 26.6"/><path d="m31.2 25.2 2.8 1.2-1 2.8"/></g></g>
 </svg></button>
 <button id="return-home" class="light small header-return-home" type="button" aria-label="Вернуться на свою ферму" hidden>Своя ферма</button>
 <nav class="header-destinations" aria-label="Места фермы">
  <button class="forest-door" id="forest-door" type="button" aria-label="Отправиться в лес">
   <svg class="forest-door-art" viewBox="0 0 160 68" aria-hidden="true" focusable="false">
    <defs><clipPath id="forest-card-clip"><rect width="160" height="68" rx="13"/></clipPath><linearGradient id="forest-sky" x2="0" y2="1"><stop stop-color="#d9e9cd"/><stop offset="1" stop-color="#f3e9bd"/></linearGradient></defs>
    <g clip-path="url(#forest-card-clip)"><rect width="160" height="68" fill="url(#forest-sky)"/><circle cx="126" cy="14" r="9" fill="#f7d579" opacity=".8"/><path d="M0 42 30 17l30 28 32-32 41 38 27-19v36H0Z" fill="#94b58b"/><path d="m0 53 34-23 34 28 34-30 58 36v18H0Z" fill="#668e67"/><path d="M77 68c-3-13 8-16 6-25-1-5-8-9-5-16 8 5 13 10 13 17 0 8-8 11-5 24Z" fill="#e6d4a0"/><path d="M77 68c-2-10 7-13 8-18 2 5-3 9-2 18" fill="#f6e7bd"/><g fill="#456d54"><path d="m18 54 13-32 13 32Zm9 8 13-34 14 34Zm78-14 14-34 14 34Zm-8 10 12-30 13 30Zm43 1 10-25 11 25Z"/></g><g fill="#7f9e69"><circle cx="11" cy="57" r="9"/><circle cx="152" cy="49" r="11"/><circle cx="61" cy="47" r="8"/></g><g fill="#f5d889"><circle cx="56" cy="60" r="1.7"/><circle cx="66" cy="55" r="1.4"/><circle cx="20" cy="64" r="1.5"/></g></g>
   </svg><span class="sr-only">Лесные тропы</span>
  </button>
  <button class="forest-door fields-door" id="fields-door" type="button" aria-label="Перейти к полям за околицей" hidden>Поля ↗</button>
 </nav>
 <div class="header-center"><span class="leaf-dot"></span> Весёлый фермер <span class="alpha">ALPHA 0.2</span></div>
 <div id="hud" class="hud"><span>Открываем калитку…</span></div>
 <div class="header-actions" id="header-actions"></div>
 <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</header>
<main class="workspace" id="game" hidden>
 <nav id="rail" class="rail" aria-label="Разделы фермы"></nav>
 <section class="scene-area" aria-label="Карта фермы">
  <div class="scene-heading"><div><div class="eyebrow" id="farm-caption">СВОЁ МЕСТО ПОД СОЛНЦЕМ</div><h1 id="farm-name">Тихая поляна</h1><p id="farm-subtitle">Посади что-нибудь хорошее.</p></div></div>
  <canvas id="farm-canvas" tabindex="0" aria-label="Интерактивная карта. Масштаб — колесо или кнопки. Двигать — WASD или стрелки, масштаб — + и −. Для действий с клавиатуры открой «Найти»."></canvas>
  <div class="map-tools" id="map-tools">
   <div class="map-tools-row"><button id="find-button" type="button" class="map-chip" aria-label="Найти объект на ферме"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 5 5"/></svg></button><button id="minimap-toggle" type="button" class="map-chip" aria-controls="minimap" aria-pressed="true" aria-label="Мини-карта"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15m6-12v15"/></svg></button></div>
   <canvas id="minimap" class="minimap" width="172" height="92" role="img" aria-label="Мини-карта фермы. Нажми или проведи пальцем, чтобы переместить камеру."></canvas>
  </div>
  <div id="placement" class="placement" hidden></div>
  <div class="scene-dock">
   <div class="scene-status"><span class="connection-dot"></span><span id="connection">Сохранено на сервере</span><button id="retry" hidden>Повторить</button></div>
   <div class="scene-actions">
    <div id="quick-stack" class="quick-stack">
     <div id="seedcard" class="seedcard" hidden></div>
     <button id="repeat-run" class="harvest-all repeat-run" type="button" hidden><span>Повторить рейс</span></button>
     <button id="harvest-all" class="harvest-all" aria-label="Собрать урожай">
      <svg class="harvest-art" viewBox="0 0 40 40" aria-hidden="true" focusable="false"><path d="M7 20h26l-3 15H10Z" fill="#b87848"/><path d="M10 23h20l-2 9H12Z" fill="#d99a5a"/><path d="M11 20c1-9 17-9 18 0" fill="none" stroke="#7e563d" stroke-width="2.5" stroke-linecap="round"/><path d="M15 19c-3-8 1-13 6-13 4 0 7 5 4 12-3 4-7 4-10 1Z" fill="#e5ad45"/><path d="M20 18c-2-8 3-13 8-11 4 2 4 8-1 12-3 2-5 1-7-1Z" fill="#d97851"/><path d="M14 18c-4-5-3-10 1-12 4-1 7 3 6 9-2 4-4 5-7 3Z" fill="#83a963"/><path d="M17 27h.1m5 0h.1m5 0h.1" stroke="#f4d29b" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Собрать урожай</span>
     </button>
    </div>
    <div class="map-controls" data-qw-group><button id="zoom-in" type="button" title="Приблизить" aria-label="Приблизить"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5.5v13M5.5 12h13"/></svg></button><button id="zoom-out" type="button" title="Отдалить" aria-label="Отдалить"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5.5 12h13"/></svg></button><button id="center-map" type="button" title="Вся ферма" aria-label="Показать всю ферму"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 9V6a1.5 1.5 0 0 1 1.5-1.5h3M15 4.5h3A1.5 1.5 0 0 1 19.5 6v3M19.5 15v3a1.5 1.5 0 0 1-1.5 1.5h-3M9 19.5H6A1.5 1.5 0 0 1 4.5 18v-3"/><circle cx="12" cy="12" r="2"/></svg></button></div>
   </div>
   <div id="seedbar" class="seedbar" data-qw-group aria-label="Семена"></div>
  </div>
  <button id="object-list-button" class="object-list-button">Список объектов</button>
 </section>
 <aside id="panel" class="side-panel" aria-label="Панель управления"><div id="panel-head"></div><div id="panel-content" class="panel-content"></div></aside>
 <section id="dasha-game-view" class="dasha-game-view" aria-label="Лисий фокус" hidden></section>
 <section id="oleg-game-view" class="oleg-game-view" aria-label="Перезвон с Олегом" hidden></section>
</main>
<section id="login" class="login-screen" hidden></section>
<dialog id="dialog"><div id="dialog-body"></div></dialog>
<noscript>Для игры нужен JavaScript. Игровые данные сохраняются на сервере.</noscript>
</body>
</html>
