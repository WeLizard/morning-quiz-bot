services:
  postgres:
    image: postgres:17-alpine
    container_name: morning-quiz-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-morning_quiz}
      POSTGRES_USER: ${POSTGRES_USER:-morning_quiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - quiz-bot-network

  quiz-bot:
    build: .
    container_name: morning-quiz-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-json}
      - DATABASE_URL=${DATABASE_URL:-}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-5}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-5}
      - DATABASE_POOL_TIMEOUT=${DATABASE_POOL_TIMEOUT:-10}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/var/log/quiz-bot
    networks:
      - quiz-bot-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python bot.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Опциональный nginx для проксирования
  nginx:
    image: nginx:alpine
    container_name: quiz-bot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - quiz-bot
    networks:
      - quiz-bot-network

networks:
  quiz-bot-network:
    driver: bridge

volumes:
  quiz-bot-data:
    driver: local
  postgres-data:
    driver: local
