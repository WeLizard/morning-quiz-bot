<!doctype html>
<html lang="ru" data-admin-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройка входа · Quiz Admin</title>
  <link rel="stylesheet" href="/static/css/quiz-brand.css">
  <link rel="stylesheet" href="/static/css/admin-auth.css">
  <script src="/static/js/admin-credentials.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="mq-brand"><span class="mq-mark" aria-hidden="true"><span></span></span><span class="mq-brand-copy"><small>MORNING QUIZ</small><strong>За кулисами</strong></span></div>
    <p class="login-eyebrow">ПУЛЬТ ВЕДУЩЕГО</p>
    <h1>Задай свой вход</h1>
    <p class="login-description">Придумай логин и пароль для админки песочницы. После сохранения первичный ключ отключится.</p>
    <form id="credentialsForm">
      <label for="username">Логин</label>
      <input id="username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="64" autofocus>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="11" maxlength="256">
      <label for="confirmation">Повтори пароль</label>
      <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" required minlength="11" maxlength="256">
      <p id="setupError" role="alert" aria-live="polite"></p>
      <button type="submit">Сохранить вход <span aria-hidden="true">→</span></button>
    </form>
    <p class="login-note">Пароль не отправляется в чат и не сохраняется в открытом виде.</p>
  </main>
</body>
</html>
