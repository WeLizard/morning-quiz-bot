name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: morning_quiz_test
          POSTGRES_USER: mqb_dev
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U mqb_dev -d morning_quiz_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://mqb_dev:local-development-only@127.0.0.1:55433/morning_quiz_test
      TEST_DATABASE_URL: postgresql+asyncpg://mqb_dev:local-development-only@127.0.0.1:55433/morning_quiz_test
      MQB_TEST_DUMP_RESTORE: "1"
      MQB_CI_POSTGRES_SERVICE: "1"
      ADMIN_ALLOWED_HOSTS: localhost,127.0.0.1,::1
      PYTHON_DOTENV_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-local-lock.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install system test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg postgresql-common
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<'EOF'
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: noble-pgdg
          Architectures: amd64
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Install hash-verified Python dependencies
        run: python -m pip install --no-cache-dir --require-hashes -r requirements-local-lock.txt

      - name: Audit locked dev/test environment and generate SBOM
        run: |
          mkdir -p .local/acceptance
          python -m pip_audit --local --vulnerability-service osv \
            --format cyclonedx-json --output .local/acceptance/dev-sbom.json

      - name: Audit runtime manifest and generate SBOM
        if: always()
        run: |
          python -m pip_audit --vulnerability-service osv --requirement requirements.txt \
            --format cyclonedx-json --output .local/acceptance/runtime-sbom.json

      - name: Verify database migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Verify reproducible Alchemy build
        run: python scripts/check_alchemy_build.py

      - name: Run Python and PostgreSQL tests
        run: |
          mkdir -p .local/acceptance
          python -m pytest -q --disable-warnings -ra --tb=short \
            --junitxml=.local/acceptance/tests.xml

      - name: Run JavaScript tests
        run: node --test tests/js/mini_navigation.test.cjs tests/js/alchemy_sync.test.cjs

      - name: Run repository checks
        run: |
          python scripts/project_checks.py --worktree
          python -m unittest discover -s tests -p test_project_checks.py
          python -m unittest discover -s tests -p test_codex_hooks.py

      - name: Upload test and dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/acceptance/tests.xml
            .local/acceptance/dev-sbom.json
            .local/acceptance/runtime-sbom.json
          if-no-files-found: ignore
          retention-days: 14
