<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QuizzyWizzy · макеты единой оболочки</title>
<style>
/* ===== qw-tokens (черновик web/shell/qw-tokens.css) ===== */
:root{
 --qw-bg:#101317;--qw-surface:#1a1e24;--qw-surface-2:#222831;--qw-line:#333941;--qw-text:#f6f8f2;--qw-muted:#b2b9c2;
 --qw-accent:#d0fc50;--qw-accent-fill:#d0fc50;--qw-accent-ink:#172300;--qw-danger:#ffaaa3;--qw-scrim:rgb(0 0 0/.55);
 --qw-game-surface:var(--qw-surface);--qw-game-text:var(--qw-text);--qw-game-accent:var(--qw-accent);--qw-game-header:var(--qw-bg);
 --qw-fs-caption:12px;--qw-fs-small:13px;--qw-fs-body:15px;--qw-fs-control:15px;--qw-fs-h3:17px;--qw-fs-h2:20px;--qw-fs-h1:26px;--qw-fs-display:64px;
 --qw-s-1:4px;--qw-s-2:8px;--qw-s-3:12px;--qw-s-4:16px;--qw-s-5:24px;--qw-s-6:32px;--qw-s-7:48px;
 --qw-gutter:16px;--qw-r-control:12px;--qw-r-card:18px;--qw-r-hero:24px;--qw-header-h:56px;--qw-tabbar-h:64px;
 --qw-safe-top:0px;--qw-safe-bottom:0px;--qw-col:100%;
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
@media (max-width:359px){:root{--qw-gutter:12px}}
@media (min-width:768px){:root{--qw-gutter:24px;--qw-col:720px}}
@media (min-width:1024px){:root{--qw-gutter:32px;--qw-col:1120px;--qw-fs-caption:13px;--qw-fs-small:14px;--qw-fs-body:16px;--qw-fs-control:16px;--qw-fs-h3:19px;--qw-fs-h2:24px;--qw-fs-h1:32px;--qw-fs-display:88px;--qw-header-h:64px}}
.tg-fs{--qw-safe-top:92px;--qw-safe-bottom:20px}
*{box-sizing:border-box}html,body{margin:0;background:var(--qw-bg);color:var(--qw-text);font-size:var(--qw-fs-body);line-height:1.5}
button{font:inherit;color:inherit}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ===== Telegram fullscreen chrome (имитация) ===== */
.tgchrome{display:none}
.tg-fs .tgchrome{display:block;position:fixed;inset:0 0 auto 0;height:var(--qw-safe-top);z-index:50;pointer-events:none}
.tgchrome .status{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:15px;font-weight:650;color:#fff}
.tgchrome .pills{display:flex;justify-content:space-between;padding:0 12px}
.tgchrome .pill{height:32px;padding:0 14px;border-radius:16px;background:rgb(40 44 50/.72);backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;color:#fff;font-size:14px;font-weight:600}
@media (max-width:359px){.tgchrome .note{display:none}}
.tgchrome .note{position:absolute;left:50%;top:52px;transform:translateX(-50%);font-size:12px;color:#ffd27a;background:rgb(0 0 0/.55);padding:2px 8px;border-radius:8px;white-space:nowrap}
/* ===== шапка ===== */
.qw-header{position:sticky;top:0;z-index:20;padding-top:var(--qw-safe-top);background:var(--qw-game-header);border-bottom:1px solid var(--qw-line)}
.qw-header .row{height:var(--qw-header-h);max-width:var(--qw-col);margin:auto;padding:0 var(--qw-gutter);display:flex;align-items:center;gap:var(--qw-s-2)}
.mode-game .qw-header .row{max-width:none}
.qw-title{flex:1;min-width:0;font-size:var(--qw-fs-h3);font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qw-title small{display:block;font-size:var(--qw-fs-caption);letter-spacing:.06em;text-transform:uppercase;color:var(--qw-game-accent);font-weight:700;line-height:1.2}
.qw-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:transparent;border:0;cursor:pointer;color:var(--qw-game-text)}
.qw-gear{background:var(--qw-game-surface);border:1px solid var(--qw-line)}
.qw-gear.on{outline:2px solid var(--qw-game-accent);outline-offset:2px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:var(--qw-fs-h3)}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--qw-accent-fill);color:var(--qw-accent-ink);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:14px}
.hud{display:flex;align-items:center;gap:12px;font-weight:750;font-size:var(--qw-fs-control)}
.hud b{display:flex;align-items:center;gap:6px}
/* ===== контент ===== */
.qw-main{max-width:var(--qw-col);margin:auto;padding:var(--qw-s-5) var(--qw-gutter) calc(var(--qw-tabbar-h) + var(--qw-safe-bottom) + var(--qw-s-6))}
.mode-game .qw-main{padding-bottom:calc(var(--qw-safe-bottom) + var(--qw-s-6))}
.narrow{max-width:760px;margin-inline:auto}
.eyebrow{font-size:var(--qw-fs-caption);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--qw-game-accent);margin:0 0 var(--qw-s-2)}
h1{font-size:var(--qw-fs-h1);line-height:1.15;margin:0 0 var(--qw-s-3);font-weight:800}
h2{font-size:var(--qw-fs-h2);margin:0 0 var(--qw-s-3);font-weight:750}
h3{font-size:var(--qw-fs-h3);margin:0 0 var(--qw-s-1)}
p{margin:0 0 var(--qw-s-3)}.muted{color:var(--qw-muted)}.small{font-size:var(--qw-fs-small)}
.card{background:var(--qw-surface);border:1px solid var(--qw-line);border-radius:var(--qw-r-card);padding:var(--qw-s-4)}
.stack{display:grid;gap:var(--qw-s-3)}
.grid2{display:grid;gap:var(--qw-s-4)}
@media (min-width:1024px){.grid2{grid-template-columns:1fr 1fr;align-items:start}.grid2.wide-left{grid-template-columns:1.2fr .8fr}}
.btn{min-height:52px;border-radius:var(--qw-r-control);border:1px solid var(--qw-line);background:var(--qw-surface-2);font-size:var(--qw-fs-control);font-weight:650;padding:0 var(--qw-s-4);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.primary{background:var(--qw-accent-fill);color:var(--qw-accent-ink);border-color:transparent}
.btn.wide{width:100%}.btn.ghost{background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border:1px solid var(--qw-line);border-radius:999px;font-size:var(--qw-fs-small);color:var(--qw-muted);background:var(--qw-surface)}
.chip.on{color:var(--qw-accent-ink);background:var(--qw-accent-fill);border-color:transparent;font-weight:650}
.seg{display:flex;background:var(--qw-surface);border:1px solid var(--qw-line);border-radius:14px;padding:4px;gap:4px;overflow-x:auto}
.seg span{flex:1;min-height:40px;display:grid;place-items:center;border-radius:10px;font-size:var(--qw-fs-small);font-weight:650;color:var(--qw-muted);white-space:nowrap;padding:0 10px}
.seg span.on{background:var(--qw-surface-2);color:var(--qw-text);box-shadow:inset 0 0 0 1px var(--qw-line)}
.row-item{display:flex;align-items:center;gap:var(--qw-s-3);min-height:56px;padding:var(--qw-s-3) 0;border-bottom:1px solid var(--qw-line)}
.row-item:last-child{border-bottom:0}.row-item .grow{flex:1;min-width:0}.row-item .grow small{display:block;color:var(--qw-muted);font-size:var(--qw-fs-small)}
.chev{color:var(--qw-muted)}
.toggle{width:46px;height:28px;border-radius:14px;background:var(--qw-line);position:relative;flex:none}.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff}.toggle.on{background:var(--qw-game-accent)}.toggle.on::after{left:21px}
.badge{font-size:var(--qw-fs-caption);font-weight:700;padding:3px 8px;border-radius:999px;background:var(--qw-surface-2);color:var(--qw-muted)}
.badge.acc{background:color-mix(in srgb,var(--qw-accent) 18%,transparent);color:var(--qw-accent)}
/* ===== нижняя панель ===== */
.qw-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--qw-bg);border-top:1px solid var(--qw-line);padding-bottom:var(--qw-safe-bottom)}
.qw-tabbar .tabs{height:var(--qw-tabbar-h);max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px 8px}
.qw-tabbar .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;color:var(--qw-muted);font-size:var(--qw-fs-caption);font-weight:650}
.qw-tabbar .tab.on{color:var(--qw-accent);background:var(--qw-surface)}
.mode-game .qw-tabbar{display:none}
/* ===== меню ⚙ ===== */
.qw-scrim{position:fixed;inset:0;background:var(--qw-scrim);z-index:30}
.qw-menu{position:fixed;z-index:40;left:0;right:0;bottom:0;max-height:85vh;overflow:auto;background:var(--qw-game-surface);color:var(--qw-game-text);border-radius:var(--qw-r-hero) var(--qw-r-hero) 0 0;padding:10px var(--qw-gutter) calc(var(--qw-s-4) + var(--qw-safe-bottom));box-shadow:0 -10px 40px rgb(0 0 0/.35)}
.qw-menu .handle{width:40px;height:5px;border-radius:3px;background:var(--qw-line);margin:0 auto 10px}
@media (min-width:768px){.qw-menu{left:auto;bottom:auto;right:max(var(--qw-gutter),calc((100vw - var(--qw-col))/2 + var(--qw-gutter)));top:calc(var(--qw-safe-top) + var(--qw-header-h) + 6px);width:340px;border-radius:var(--qw-r-hero);padding:var(--qw-s-3) var(--qw-s-4)}.mode-game .qw-menu{right:var(--qw-gutter)}.qw-menu .handle{display:none}.qw-scrim{background:rgb(0 0 0/.25)}}
.qw-menu .acct{display:flex;align-items:center;gap:12px;padding:8px 0 12px;border-bottom:1px solid var(--qw-line)}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7bd389,#2f7d5b);display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.qw-menu h4{margin:14px 0 4px;font-size:var(--qw-fs-caption);letter-spacing:.06em;text-transform:uppercase;color:var(--qw-game-accent)}
.mi{display:flex;align-items:center;gap:12px;min-height:48px;font-size:var(--qw-fs-control);font-weight:600;border-radius:12px;padding:0 8px;margin:0 -8px}
.mi .grow{flex:1}.mi small{color:var(--qw-muted);font-size:var(--qw-fs-small);font-weight:400}
.mi.danger{color:var(--qw-danger)}
.mi.core{font-weight:700}
.callout{position:fixed;z-index:60;background:#ffd27a;color:#2a1d00;font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;box-shadow:0 4px 14px rgb(0 0 0/.4)}
/* ===== фон-скриншоты игр ===== */
.shot{position:fixed;left:0;right:0;bottom:0;top:calc(var(--qw-safe-top) + var(--qw-header-h));background-repeat:no-repeat;background-size:100% auto;z-index:0}
.mode-game.farm{--qw-game-header:#1b2b22;--qw-game-surface:#22372b;--qw-game-text:#f2f1e3;--qw-game-accent:#a6d37a;--qw-line:#3a5444;--qw-muted:#b9c7b4}
.mode-game.alchemy{--qw-game-header:#183126;--qw-game-surface:#1d3a2d;--qw-game-text:#efe9d6;--qw-game-accent:#d7b46a;--qw-line:#355546;--qw-muted:#b5c4b5}
.mode-game.mafia{--qw-game-header:#0d1014;--qw-game-surface:#171b21;--qw-game-accent:#e9a23b;--qw-accent-fill:#e9a23b;--qw-accent-ink:#241400;--qw-accent:#e9a23b}
/* ===== экранные детали ===== */
.hero{display:grid;grid-template-columns:1fr 38%;align-items:center;background:var(--qw-surface);border:1px solid var(--qw-line);border-radius:var(--qw-r-hero);overflow:hidden;min-height:180px}
.hero .txt{padding:var(--qw-s-5) var(--qw-s-4)}.hero img{width:100%;height:100%;object-fit:cover}
@media (min-width:1024px){.hero{min-height:300px}.hero .txt{padding:48px}}
.games{display:grid;gap:var(--qw-s-3);margin-top:var(--qw-s-5)}
@media (min-width:768px){.games{grid-template-columns:1fr 1fr}}@media (min-width:1024px){.games{grid-template-columns:repeat(3,1fr)}}
.game{display:grid;grid-template-columns:64px 1fr auto;gap:var(--qw-s-3);align-items:center;background:var(--qw-surface);border:1px solid var(--qw-line);border-radius:var(--qw-r-card);padding:var(--qw-s-3)}
.game .pic{width:64px;height:64px;border-radius:14px;background-size:cover;background-position:center;display:grid;place-items:center;font-size:30px;background-color:var(--qw-surface-2)}
.game .tag{font-size:var(--qw-fs-caption);color:var(--qw-muted)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:var(--qw-s-4) 0}
.owlrow{display:flex;gap:12px;align-items:center;margin:var(--qw-s-4) 0}.owlrow img{width:56px;height:56px;border-radius:14px;object-fit:cover}
.score{font-size:var(--qw-fs-display);font-weight:850;line-height:1;color:var(--qw-accent);text-align:center;margin:var(--qw-s-4) 0 var(--qw-s-1)}
.answers .row-item .ph{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#3b4a5a,#5d6f45);flex:none}
.plus{font-weight:800;color:var(--qw-accent)}
.mhero{border-radius:var(--qw-r-hero);overflow:hidden;position:relative;min-height:170px;background:#000 url(mafia-card.webp) center/cover;border:1px solid #3a2a12;display:flex;align-items:flex-end}
.mhero .txt{padding:var(--qw-s-4);background:linear-gradient(transparent,rgb(0 0 0/.85));width:100%}
@media (min-width:1024px){.mhero{min-height:260px}.mhero .txt{padding:32px}}
.counts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:var(--qw-s-3) 0}
.counts span{min-height:44px;display:grid;place-items:center;border:1px solid var(--qw-line);border-radius:12px;font-weight:700}
.counts span.on{border-color:var(--qw-game-accent);color:var(--qw-game-accent);background:color-mix(in srgb,var(--qw-game-accent) 12%,transparent)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.roles div{border:1px solid var(--qw-line);border-radius:14px;padding:10px 12px}.roles b{display:block;font-size:22px;color:var(--qw-game-accent)}
.seat{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px dashed var(--qw-line)}.seat:last-child{border:0}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:var(--qw-s-4) 0}
.podium>div{background:var(--qw-surface);border:1px solid var(--qw-line);border-radius:16px;text-align:center;padding:12px 6px}
.podium .medal{font-size:28px}.podium>.p1{padding-top:20px;border-color:#c9a53a}.podium b{display:block;font-size:var(--qw-fs-control)}.podium small{color:var(--qw-muted);font-size:var(--qw-fs-small)}
.rank{width:36px;text-align:center;font-weight:800;color:var(--qw-muted)}
.me-bar{position:fixed;left:0;right:0;bottom:calc(var(--qw-tabbar-h) + var(--qw-safe-bottom));z-index:19;padding:0 var(--qw-gutter) 8px}
.me-bar .in{max-width:calc(var(--qw-col) - 2*var(--qw-gutter));margin:auto;display:flex;align-items:center;gap:12px;background:var(--qw-surface-2);border:1px solid var(--qw-accent);border-radius:16px;padding:10px 14px;font-weight:700}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:768px){.metrics{grid-template-columns:repeat(3,1fr)}}
.metric{background:var(--qw-surface);border:1px solid var(--qw-line);border-radius:16px;padding:12px 14px}.metric b{display:block;font-size:var(--qw-fs-h2)}.metric span{font-size:var(--qw-fs-small);color:var(--qw-muted)}
.ach{display:flex;gap:10px;align-items:center}.ach i{font-style:normal;font-size:26px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--qw-surface-2)}
.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:var(--qw-fs-small);color:var(--qw-muted)}.select{min-height:48px;border:1px solid var(--qw-line);border-radius:12px;background:var(--qw-surface-2);display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.newtag{font-size:var(--qw-fs-caption);font-weight:700;color:#2a1d00;background:#ffd27a;border-radius:6px;padding:1px 6px;margin-left:6px}
</style>
</head>
