<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101317">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Telegram-first прототип Mini App для Morning Quiz Bot">
  <title>Morning Quiz — Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="visually-hidden" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 7 8 5-8 5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zm4 9v4m-4 3h8M6 6H3v1a4 4 0 0 0 4 4m11-5h3v1a4 4 0 0 1-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 20a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16h12l-1.4-2.2V10a4.6 4.6 0 0 0-9.2 0v3.8zM10 19h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M13 3c1 4-3 5-1 8 1-2 3-2 4-4 3 3 4 7 2 10a7 7 0 0 1-12-1c-2-4 1-7 4-10 0 3 1 4 2 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m6 12 4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-clue" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15.5 15.5 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-mention" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 12v2a2 2 0 0 0 4 0v-2a8 8 0 1 0-3 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  </svg>

  <main class="demo-layout">
    <aside class="demo-panel" aria-labelledby="demo-title">
      <span class="demo-kicker">Telegram-first prototype</span>
      <h1 id="demo-title">Mini App, который ощущается нативно</h1>
      <p class="demo-description" id="demo-description">Главный экран показывает только то, что важно сейчас: квиз дня, личный ритм и живой рейтинг чата.</p>

      <div class="concept-picker" role="tablist" aria-label="Концепты Mini App">
        <button type="button" class="concept-button" role="tab" aria-selected="true" data-view="home"><span class="concept-index">01</span><span><span class="concept-name">Дом игрока</span><span class="concept-note">Ежедневный вход и прогресс</span></span><span class="concept-arrow">›</span></button>
        <button type="button" class="concept-button" role="tab" aria-selected="false" data-view="quiz"><span class="concept-index">02</span><span><span class="concept-name">Квиз</span><span class="concept-note">Нативная MainButton и ответ</span></span><span class="concept-arrow">›</span></button>
        <button type="button" class="concept-button" role="tab" aria-selected="false" data-view="case"><span class="concept-index">03</span><span><span class="concept-name">Ночной город</span><span class="concept-note">Digest, дедлайн и действие</span></span><span class="concept-arrow">›</span></button>
      </div>

      <div class="demo-tools">
        <div class="theme-toggle" aria-label="Тема предпросмотра">
          <button type="button" class="active" data-theme="dark">Тёмная</button>
          <button type="button" data-theme="light">Светлая</button>
        </div>
        <span>В Telegram тема применяется автоматически.</span>
      </div>
    </aside>

    <section class="phone-stage" aria-label="Предпросмотр Telegram Mini App">
      <div class="phone" id="phone">
        <div class="device-bar" aria-hidden="true"><span>09:41</span><span>● ◔ ▰</span></div>
        <nav class="mobile-demo-switcher" aria-label="Сменить концепт">
          <button type="button" class="active" data-view="home" aria-label="Дом игрока">01</button>
          <button type="button" data-view="quiz" aria-label="Квиз">02</button>
          <button type="button" data-view="case" aria-label="Ночной город">03</button>
        </nav>
        <div id="app" aria-live="polite"></div>
        <button type="button" class="local-main-button" id="local-main-button" hidden></button>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <template id="home-template">
    <div class="screen home-screen">
      <header class="topbar home-topbar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span><small>Morning Quiz</small><strong>Daily drop</strong></span>
        </div>
        <div class="profile-lockup">
          <span><small>Серия</small><strong>12 дней</strong></span>
          <button type="button" class="avatar" data-toast="Профиль Лизарда" aria-label="Открыть профиль">Л</button>
        </div>
      </header>

      <section class="daily-card" aria-labelledby="daily-title">
        <div class="host-media">
          <img class="host-art" src="assets/host-daily.webp" alt="Сова-ведущий Morning Quiz в студии с микрофоном">
          <div class="daily-card-head"><span class="live-pill"><i></i>Сова в эфире</span><span class="drop-number">№ 149</span></div>
          <div class="host-caption"><span>Сегодня · 09:00</span><strong>Нелогичная логика</strong></div>
        </div>
        <div class="daily-copy">
          <span class="card-kicker">Квиз дня · 5 вопросов</span>
          <h1 id="daily-title">Сова спрашивает.<br><em>Чат отвечает.</em></h1>
          <p>Три минуты без скучных анкет. Результаты откроются, когда ответят все.</p>
          <div class="daily-footer">
            <div class="daily-meta"><span><svg aria-hidden="true"><use href="#i-clock"></use></svg>≈ 3 мин</span><span>+50 XP</span></div>
            <button type="button" class="cta-button" data-go="quiz"><span>В игру</span><b aria-hidden="true">↗</b></button>
          </div>
        </div>
      </section>

      <section class="pulse-card" aria-label="Личная статистика">
        <div class="pulse-heading"><span>Твой пульс</span><small>7 дней</small></div>
        <div class="pulse-chart" aria-hidden="true"><i style="--h:40%"></i><i style="--h:65%"></i><i style="--h:48%"></i><i style="--h:82%"></i><i style="--h:57%"></i><i style="--h:92%"></i><i class="today" style="--h:72%"></i></div>
        <div class="pulse-metrics">
          <article><strong>84%</strong><span>точность</span></article>
          <article><strong>7</strong><span>место</span></article>
          <article><strong>420</strong><span>XP</span></article>
        </div>
      </section>

      <div class="section-label"><h2>Гонка в чате</h2><button type="button" data-toast="Полный рейтинг появится здесь">Все 12 →</button></div>
      <section class="list-card leaderboard-card" aria-label="Рейтинг чата">
        <div class="ranking-row leader"><span class="rank">01</span><span class="small-avatar coral">АК</span><span class="ranking-copy"><strong>Аня К.</strong><span>5/5 · быстрее всех</span></span><span class="score">950</span></div>
        <div class="ranking-row"><span class="rank">02</span><span class="small-avatar violet">МС</span><span class="ranking-copy"><strong>Макс</strong><span>5/5 · 02:11</span></span><span class="score">912</span></div>
        <div class="ranking-row you-row"><span class="rank">07</span><span class="small-avatar you">Л</span><span class="ranking-copy"><strong>Ты</strong><span>квиз ещё впереди</span></span><span class="score">420</span></div>
      </section>
    </div>
    <nav class="tabbar" aria-label="Основная навигация">
      <button type="button" aria-current="page"><svg aria-hidden="true"><use href="#i-home"></use></svg>Главная</button>
      <button type="button" data-go="quiz"><svg aria-hidden="true"><use href="#i-play"></use></svg>Играть</button>
      <button type="button" data-toast="Полный рейтинг появится здесь"><svg aria-hidden="true"><use href="#i-trophy"></use></svg>Рейтинг</button>
      <button type="button" data-toast="Профиль появится здесь"><svg aria-hidden="true"><use href="#i-user"></use></svg>Профиль</button>
    </nav>
  </template>

  <template id="quiz-template">
    <div class="screen quiz-screen">
      <header class="topbar">
        <button type="button" class="icon-button inline-back" data-back aria-label="Назад"><svg aria-hidden="true"><use href="#i-back"></use></svg></button>
        <div class="topbar-copy"><small>Утренний квиз</small><strong>Вопрос 2 из 5</strong></div>
        <img class="quiz-host-avatar" src="assets/host-daily.webp" alt="Сова-ведущий">
      </header>

      <div class="quiz-progress"><div class="progress-track" role="progressbar" aria-label="Прогресс квиза" aria-valuemin="0" aria-valuemax="5" aria-valuenow="2"><div class="progress-value"></div></div><span>02 / 05</span></div>
      <span class="category">Логика</span>
      <h1 class="question">Какое число продолжает последовательность: 2, 6, 12, 20, 30?</h1>

      <fieldset class="answer-fieldset">
        <legend class="visually-hidden">Выберите один вариант ответа</legend>
        <div class="answers" role="radiogroup" aria-label="Варианты ответа">
          <button type="button" class="answer" role="radio" aria-checked="false" data-answer="a"><span class="answer-letter">A</span><span>36</span><svg class="answer-check" aria-hidden="true"><use href="#i-check"></use></svg></button>
          <button type="button" class="answer" role="radio" aria-checked="false" data-answer="b"><span class="answer-letter">B</span><span>40</span><svg class="answer-check" aria-hidden="true"><use href="#i-check"></use></svg></button>
          <button type="button" class="answer" role="radio" aria-checked="false" data-answer="c"><span class="answer-letter">C</span><span>42</span><svg class="answer-check" aria-hidden="true"><use href="#i-check"></use></svg></button>
          <button type="button" class="answer" role="radio" aria-checked="false" data-answer="d"><span class="answer-letter">D</span><span>48</span><svg class="answer-check" aria-hidden="true"><use href="#i-check"></use></svg></button>
        </div>
      </fieldset>
      <div class="explanation" id="explanation" role="status"><strong>Правильный ответ — 42.</strong><br>Разности растут на два: +4, +6, +8, +10, затем +12.</div>
    </div>
  </template>

  <template id="case-template">
    <div class="screen case-screen">
      <header class="topbar">
        <button type="button" class="icon-button inline-back" data-back aria-label="Назад"><svg aria-hidden="true"><use href="#i-back"></use></svg></button>
        <div class="avatar case-avatar" aria-hidden="true">VII</div>
        <div class="topbar-copy"><small>Дело #07</small><strong>Театр на Седьмой улице</strong></div>
        <button type="button" class="icon-button" data-toast="Одно новое упоминание" aria-label="Уведомления"><svg aria-hidden="true"><use href="#i-bell"></use></svg></button>
      </header>

      <section class="mafia-hero" aria-labelledby="case-title">
        <img src="assets/host-mafia.webp" alt="Сова в капюшоне за столом детектива">
        <div class="mafia-hero-head"><span class="mafia-status"><i></i>Ночная фаза</span><span>Дело 07</span></div>
        <div class="mafia-hero-copy">
          <span class="card-kicker">Город засыпает</span>
          <h1 id="case-title">Кому вы доверяете?</h1>
          <p>Выберите действие до конца фазы</p>
          <div class="deadline" aria-label="До конца фазы 3 часа 42 минуты 18 секунд"><div><strong>03</strong><span>часа</span></div><div><strong>42</strong><span>минуты</span></div><div><strong>18</strong><span>секунд</span></div></div>
        </div>
      </section>

      <div class="section-label"><h2>Что изменилось</h2><span>после 02:10</span></div>
      <section class="list-card" aria-label="Сводка изменений">
        <div class="digest-row"><span class="digest-icon"><svg aria-hidden="true"><use href="#i-clue"></use></svg></span><span class="digest-copy"><strong>Найдены две улики</strong><span>Камера и обрывок билета</span></span><time>8 мин</time></div>
        <div class="digest-row"><span class="digest-icon"><svg aria-hidden="true"><use href="#i-mention"></use></svg></span><span class="digest-copy"><strong>Вас упомянул Марк</strong><span>«У Лизарда было окно…»</span></span><time>21 мин</time></div>
        <div class="digest-row"><span class="digest-icon"><svg aria-hidden="true"><use href="#i-target"></use></svg></span><span class="digest-copy"><strong>Действие не выбрано</strong><span>Доступно до конца фазы</span></span><time>сейчас</time></div>
      </section>

      <div class="section-label"><h2>Ваш следующий шаг</h2><span>выберите один</span></div>
      <div class="case-actions" role="radiogroup" aria-label="Доступные действия">
        <button type="button" class="case-action" role="radio" aria-checked="false" data-case-action="clues"><span class="case-action-icon"><svg aria-hidden="true"><use href="#i-clue"></use></svg></span><span><strong>Изучить улики</strong><span>Два новых материала</span></span><svg class="answer-check" aria-hidden="true"><use href="#i-check"></use></svg></button>
        <button type="button" class="case-action" role="radio" aria-checked="false" data-case-action="alibi"><span class="case-action-icon"><svg aria-hidden="true"><use href="#i-target"></use></svg></span><span><strong>Проверить алиби</strong><span>Особое действие детектива</span></span><svg class="answer-check" aria-hidden="true"><use href="#i-check"></use></svg></button>
      </div>
    </div>
  </template>

  <noscript><div class="error-state"><div><h1>Нужен JavaScript</h1><p>Telegram Mini Apps используют JavaScript для взаимодействия с клиентом и интерфейсом.</p></div></div></noscript>
  <script src="app.js"></script>
</body>
</html>
